name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# read-only by default; only the release job may write (to publish a GitHub release)
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04  # older glibc = runs on more distributions
            artifact: ptdesk-linux-x86_64
          - os: windows-latest
            artifact: ptdesk-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      # third-party code is pinned to a commit; Dependabot keeps the pins up to date
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"
          cache: pip

      # The Linux Python of setup-python is built without Bluetooth sockets (socket.AF_BLUETOOTH missing),
      # so the packaged app could not reach the printer. The deadsnakes build has them.
      - name: Python with Bluetooth sockets (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python3.12 python3.12-venv python3.12-dev
          python3.12 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/python" -c "import socket; socket.AF_BLUETOOTH, socket.BTPROTO_RFCOMM"

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python packaging/make_icon.py
          pyinstaller --noconfirm --clean --distpath dist --workpath build packaging/ptdesk.spec

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cp packaging/ptdesk.png README.md LICENSE THIRD_PARTY_NOTICES.md dist/ptdesk/
          dist/ptdesk/ptdesk-cli diagnose
          dist/ptdesk/ptdesk-cli render -o dist/selftest.png
          tar -czf dist/${{ matrix.artifact }}.tar.gz -C dist ptdesk

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md dist\ptdesk\
          dist\ptdesk\ptdesk-cli.exe diagnose
          if ($LASTEXITCODE -ne 0) { throw "diagnose failed" }
          dist\ptdesk\ptdesk-cli.exe render -o dist\selftest.png
          if ($LASTEXITCODE -ne 0) { throw "render failed" }
          Compress-Archive -Path dist\ptdesk -DestinationPath dist\${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.zip
            dist/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: |
            dist/ptdesk-windows.zip
            dist/ptdesk-linux-x86_64.tar.gz
          fail_on_unmatched_files: true
