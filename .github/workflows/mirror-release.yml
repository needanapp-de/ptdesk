name: Mirror release

# Copies a GitHub release (notes and files) to the mirror on git.needanapp.de (Forgejo).
# Called by build.yml after each release; can also be started by hand for an existing tag.
# Needs the repository secret FORGEJO_TOKEN (Forgejo access token with repository read/write).
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      FORGEJO_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, z. B. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  FORGEJO_API: https://git.needanapp.de/api/v1/repos/needanapp.de/ptdesk

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9][0-9A-Za-z.-]*$ ]] || { echo "::error::Kein gültiges Tag: $TAG"; exit 1; }
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dist
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json name,body,isPrerelease > release.json

      - name: Publish on git.needanapp.de
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [ -n "$TOKEN" ] || { echo "::error::Secret FORGEJO_TOKEN fehlt"; exit 1; }
          api() { curl -sS --fail-with-body -H "Authorization: token $TOKEN" "$@"; }

          # Forgejo would create a missing tag on the default branch, i.e. on the wrong commit
          tag_status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: token $TOKEN" "$FORGEJO_API/tags/$TAG")
          [ "$tag_status" = 200 ] || { echo "::error::Tag $TAG fehlt im Spiegel (HTTP $tag_status), zuerst pushen"; exit 1; }

          options=$(jq --arg tag "$TAG" '{tag_name: $tag, name: .name, body: .body, prerelease: .isPrerelease}' release.json)
          status=$(curl -sS -o forgejo.json -w '%{http_code}' -H "Authorization: token $TOKEN" "$FORGEJO_API/releases/tags/$TAG")
          if [ "$status" = 404 ]; then
            api -H "Content-Type: application/json" -d "$options" "$FORGEJO_API/releases" -o forgejo.json
          elif [ "$status" = 200 ]; then
            api -X PATCH -H "Content-Type: application/json" -d "$options" "$FORGEJO_API/releases/$(jq -r .id forgejo.json)" -o forgejo.json
          else
            echo "::error::Release-Abfrage fehlgeschlagen (HTTP $status)"; cat forgejo.json; exit 1
          fi
          id=$(jq -r .id forgejo.json)

          # replace files of the same name, so running it again gives the same result
          for file in dist/*; do
            name=$(basename "$file")
            for asset in $(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .id' forgejo.json); do
              api -X DELETE "$FORGEJO_API/releases/$id/assets/$asset"
            done
            api -F "attachment=@$file" "$FORGEJO_API/releases/$id/assets?name=$name" -o /dev/null
            echo "Hochgeladen: $name"
          done
          echo "Fertig: $(jq -r .html_url forgejo.json)"
